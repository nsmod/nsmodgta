:root{

html{background:#070e1c}

:root{
  --type-display:'Sora','Be Vietnam Pro',system-ui,sans-serif;
  --type-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --type-meta:'DM Sans','Be Vietnam Pro',system-ui,sans-serif;
}
body{font-family:var(--type-ui);font-size:13px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.brand-name{font:800 22px/1.1 var(--type-display);letter-spacing:-.8px}

.hero-action{font:800 12px/1.2 var(--type-ui)}
.section-title,.page-top h1{font:800 25px/1.24 var(--type-display);letter-spacing:-.85px;text-transform:none}
.page-top h1{font-size:27px}
.section-description,.page-top p{font:500 12px/1.6 var(--type-ui);color:#e0eeff}
.eyebrow{font:800 10px/1.3 var(--type-meta);color:#8affdf;letter-spacing:1px}

.featured-grid{display:grid!important;grid-template-columns:1fr!important;gap:12px;margin:4px 0 15px}

.category-feature::before{background:linear-gradient(90deg,#071328f1 0%,#07172bca 61%,#06132945 100%)!important}

.feature-latest::before{background:linear-gradient(90deg,#081c3af5 0%,#0c204ac9 65%,#081c3f40 100%)!important}
.feature-badge{font:800 10px/1.1 var(--type-meta);letter-spacing:.2px;padding:7px 10px;border-radius:9px;background:#061022e8;color:#fff;border:1px solid #cdefff7d;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);margin:0}
.feature-main{display:flex!important;flex-wrap:nowrap!important;align-items:center!important;gap:11px;position:relative;z-index:3;width:100%;margin-top:12px;background:rgba(4,13,30,.90);border:1px solid rgba(206,236,255,.34);border-radius:14px;padding:11px 12px;box-shadow:0 7px 16px #0009;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.feature-icon{width:38px;height:38px;flex:0 0 38px;background:#24405c;border:1px solid #81e7fa85;color:#fff;border-radius:11px}

.feature-copy small{font:600 11px/1.36 var(--type-ui);color:#e4f4ff;opacity:1;display:block}
.feature-arrow{width:29px;height:29px;flex:0 0 29px;position:relative!important;top:auto!important;right:auto!important;bottom:auto!important;color:#fff;background:#244663;border:1px solid #93ddff7d}

/* Category tiles: dark glass caption ensures full legibility on photography. */

.category-card:focus-visible,.category-feature:focus-visible{outline:3px solid #deff82;outline-offset:3px}

.cat-name{font:800 15px/1.22 var(--type-display);letter-spacing:-.4px;margin:0;color:#fff!important;text-shadow:0 1px 5px #000e;max-width:100%;text-transform:none;overflow-wrap:normal}

   earlier selector `.popup-card > * {position:relative}`. */
.popup-root{z-index:80;padding:18px;isolation:isolate}
.popup-dim{background:rgba(2,6,18,.83);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.popup-card{position:relative;width:min(100%,390px);max-height:calc(100dvh - 40px);overflow-y:auto;overflow-x:hidden;display:block;padding:0;background:#0e1f38;border:1px solid #4b8cb7;border-radius:25px;color:#fff;text-align:left;box-shadow:0 28px 90px #000d,0 0 0 1px #83ddff1f}
.popup-card::before{display:none}
.popup-card>.popup-art{position:relative;z-index:0;height:121px;background:linear-gradient(180deg,#081b3026,#0e1f38ee),url('ICON/banner.webp') center 45%/cover no-repeat;border-radius:24px 24px 0 0}

.popup-card>.popup-content{position:relative;z-index:2;padding:0 22px 21px;margin-top:-31px;text-align:center}
.popup-content>.popup-symbol{display:grid;place-items:center;width:59px;height:59px;margin:0 auto 12px;border-radius:19px;background:linear-gradient(140deg,#20c8ec,#287af5);color:#fff;border:3px solid #112a43;box-shadow:0 11px 24px #000a;position:relative}

 guide:'<path d="M5 3h10l4 4v14H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M15 3v5h5M8 12h8M8 16h7"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.3"/><path d="m3 18 6-5 4 3 3-4 5 6"/>',
 paperplane:'<path d="m21 3-3.7 18-6-5-3.5 2 .8-5L3 11Z"/><path d="m8.6 13 8.4-6-5.7 9"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
 files:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8m-8 4h6"/>',
 check:'<path d="m5 12 4 4 10-10"/>'
};
const icon=(key,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[key]||icons.files}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('vi').trim();
function safeHttp(s){try{const u=new URL(String(s||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
const IMG_FOLDERS = ['ICON','MOD NHÂN VẬT','MOD SKIN','MOD TẦM NHÌN','FIX LAG','MOD Ô TÔ','MOD XE MÁY','ĐỒ HỌA','SCRIPT','HƯỚNG DẪN'];
function safeLocal(s){
  const p=String(s||'').trim().replace(/\\/g,'/');
  if(!p||p.startsWith('/')||p.includes('//')||/^[a-z][a-z0-9+.-]*:/i.test(p)||/[?#<>"'`]/.test(p))return '';
  const parts=p.split('/');
  if(parts.some(x=>!x||x==='.'||x==='..'))return '';
  if(!IMG_FOLDERS.includes(parts[0])&&parts[0]!=='assets')return '';
  return /^[\p{L}\p{N} _./()+-]+$/u.test(p)?p:'';
}
const imageURL=s=>safeLocal(s)||safeHttp(s)||'';
const linkURL=m=>safeHttp(m.linkUrl||m.videoUrl||m.downloadUrl);
const telegram=safeHttp(cfg.telegramUrl)||'https://t.me/sonchoigame23';
const catBy=id=>categories.find(c=>c.id===id);
const stamp=v=>{const raw=String(v||'').trim();if(!raw)return 0;const withZone=/^\d{4}-\d\d-\d\d$/.test(raw)?raw+'T00:00:00+07:00':raw;const n=Date.parse(withZone);return Number.isFinite(n)?n:0};
const updated=m=>stamp(m.updatedAt||m.updated);
const byDate=(a,b)=>updated(b)-updated(a)||String(a.title).localeCompare(String(b.title),'vi');
const sorted=()=>[...mods].sort(byDate);
function dateText(m){const t=updated(m);if(!t)return 'Chưa có thời gian';const p=Object.fromEntries(new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).filter(i=>i.type!=='literal').map(i=>[i.type,i.value]));return `${p.hour}:${p.minute} • ${p.day}/${p.month}/${p.year}`}
function getFavs(){try{const a=JSON.parse(localStorage.getItem(FAVKEY)||'[]');return new Set(Array.isArray(a)?a.map(String):[])}catch{return new Set()}}
let favs=getFavs();const favCount=()=>mods.filter(m=>favs.has(String(m.id))).length;
let toastHandle;function notify(msg){$toast.textContent=msg;$toast.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>$toast.classList.remove('show'),2400)}
const route=()=>{const raw=location.hash.startsWith('#/')?location.hash.slice(2):'';let [path,query='']=raw.split('?');const parts=path.split('/').filter(Boolean);let id=parts[1]||'';try{id=decodeURIComponent(id)}catch{id=''}const page=parts[0]==='guide'?'category':(parts[0]||(location.hash==='#/'?'home':'categories'));return{page,id:parts[0]==='guide'?'huongdan':id,query:new URLSearchParams(query)}};
let filters={q:'',cat:'',sort:'new'};let previousRoute='';let priorFocus=null;
function header(){const avatar=imageURL(cfg.avatar)||'ICON/logo.svg';$header.innerHTML=`<a class="brand" href="#/" aria-label="Về trang chủ"><img class="brand-logo" alt="Logo NSMOD" src="${esc(avatar)}"><span><strong class="brand-name">${esc(cfg.siteName||'NSMOD')}<i>.</i></strong><small class="brand-meta">GTA V · iOS MOD HUB</small></span></a><div class="head-actions"><a class="head-button" href="#/latest" aria-label="Xem file mới">${icon('clock',19)}</a><a class="head-button tg" href="${esc(telegram)}" target="_blank" rel="noopener noreferrer" aria-label="Telegram NSMOD">${icon('paperplane',19)}</a></div>`}
function bottomNav(r){const active=r.page==='home'?'home':r.page==='favorites'?'favorites':r.page==='categories'||r.page==='category'?'categories':'latest';$nav.innerHTML=[['home','Trang chủ','home','#/'],['latest','Mới nhất','clock','#/latest'],['categories','Danh mục','grid','#/categories'],['favorites','Yêu thích','heart','#/favorites']].map(([id,label,ic,href])=>`<a href="${href}" class="nav-link ${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(ic,21)}<span>${label}</span>${id==='favorites'&&favCount()?`<span class="nav-count">${favCount()}</span>`:''}</a>`).join('')}
function sectionHead(kicker,title,href,desc=''){return `<div class="section-head"><div><div class="eyebrow">${esc(kicker)}</div><h2 class="section-title">${esc(title)}</h2>${desc?`<p class="section-description">${esc(desc)}</p>`:''}</div>${href?`<a class="see-all" href="${href}">Xem tất cả ${icon('arrow',14)}</a>`:''}</div>`}
function categoryCard(c){const photo=imageURL(c.photo);return `<a class="category-card tone-${esc(c.tone||'blue')}" href="#/category/${encodeURIComponent(c.id)}" aria-label="Xem ${esc(c.name)}">${photo?`<img class="cat-bg" loading="lazy" decoding="async" src="${esc(photo)}" alt="" onerror="this.onerror=null;this.src='${esc(imageURL('ICON/chua-co-anh.svg'))}'">`:''}<span class="cat-ico">${icon(c.icon,25)}</span><div class="cat-copy"><div class="cat-name">${esc(c.name)}</div><div class="cat-sub">${esc(c.subtitle||'')}</div></div><span class="cat-end">${icon('arrow',17)}</span></a>`}
function featuredCard(type){
 const isGuide=type==='guide',photo=imageURL(isGuide?cfg.guideImage:cfg.latestImage),backup=imageURL('ICON/chua-co-anh.svg');
 return `<a class="category-feature ${isGuide?'feature-guide':'feature-latest'}" href="${isGuide?'#/category/huongdan':'#/latest'}">${photo?`<img class="feature-bg" loading="lazy" decoding="async" src="${esc(photo)}" alt="" onerror="this.onerror=null;this.src='${esc(backup)}'">`:''}<span class="feature-badge">${isGuide?'▶ VIDEO & TIP TRICK':'✦ VỪA CẬP NHẬT'}</span><span class="feature-main"><span class="feature-icon">${icon(isGuide?'guide':'clock',27)}</span><span class="feature-copy"><strong>${isGuide?'HƯỚNG DẪN CÀI & TIP TRICK':'MỚI NHẤT'}</strong><small>${isGuide?'Video hướng dẫn, mẹo sử dụng, thủ thuật':'Card mới theo ngày, giờ và phút cập nhật'}</small></span><span class="feature-arrow">${icon('arrow',19)}</span></span></a>`;
}
function categoriesGrid(){return `<div class="featured-grid">${featuredCard('latest')}${featuredCard('guide')}</div><div class="category-grid category-grid-main">${categories.filter(c=>c.id!=='huongdan').map(categoryCard).join('')}</div>`}

function searchBox(value=''){return `<form class="search-wrap" data-search-form role="search">${icon('search',19)}<input type="search" aria-label="Tìm kiếm MOD" name="q" placeholder="Tìm MOD, video, tip trick..." value="${esc(value)}" autocomplete="off"><button class="search-submit" type="submit" aria-label="Tìm kiếm">${icon('arrow',17)}</button></form>`}
function downloadButton(m){
 const url=linkURL(m), guide=m.category==='huongdan';
 const label=guide?'XEM VIDEO':'TẢI XUỐNG';
 const fallback=guide?'CHƯA CÓ LINK VIDEO':'CHƯA CÓ LINK TẢI';
 return url?`<a class="download-btn ${guide?'video-btn':''}" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${guide?'Mở liên kết video':'Mở liên kết tải'} ${esc(m.title)}">${icon(guide?'guide':'download',19)}<span>${label}</span><span class="link-arrow" aria-hidden="true">↗</span></a>`:`<span class="download-btn disabled ${guide?'video-btn':''}" aria-disabled="true">${icon('clock',17)} ${fallback}</span>`;
}

function fileCard(m){const cat=catBy(m.category);const cover=imageURL(m.cover)||'ICON/chua-co-anh.svg';const gallery=[m.cover,...(Array.isArray(m.gallery)?m.gallery:[])].filter(x=>imageURL(x));const hasGallery=gallery.length>0;return `<article class="file-card file-card-${esc(cat?.tone||'blue')}"><div class="file-primary"><${hasGallery?'button':'div'} class="thumb" ${hasGallery?`type="button" data-gallery="${esc(m.id)}" aria-label="Xem ảnh ${esc(m.title)}"`:''}><img loading="lazy" decoding="async" alt="Ảnh ${esc(m.title)}" src="${esc(cover)}" onerror="this.onerror=null;this.src='${esc(imageURL('ICON/chua-co-anh.svg'))}'" /></${hasGallery?'button':'div'}><div class="file-info"><div class="file-category"><span class="category-pulse"></span>${esc(cat?.name||'MOD GTA V')}</div><h3 class="file-name">${esc(m.title)}</h3>${m.description?`<p class="file-desc">${esc(m.description)}</p>`:''}<div class="file-chips"><span class="file-chip">${esc(m.format||'FILE')}</span>${m.size?`<span class="file-chip">${esc(m.size)}</span>`:''}${m.demo?`<span class="file-chip demo">CARD MẪU</span>`:''}</div><div class="file-time">${icon('clock',12)}${esc(dateText(m))}</div></div><button class="favorite ${favs.has(String(m.id))?'active':''}" aria-pressed="${favs.has(String(m.id))}" type="button" data-fav="${esc(m.id)}" aria-label="${favs.has(String(m.id))?'Bỏ yêu thích':'Lưu yêu thích'} ${esc(m.title)}">${icon('heart',19)}</button></div><div class="file-actions">${downloadButton(m)}${hasGallery?`<button class="gallery-btn" type="button" data-gallery="${esc(m.id)}" aria-label="Xem album ảnh ${esc(m.title)}">${icon('image',19)}</button>`:''}</div></article>`}
function fileList(a,emptyTitle='Chưa có file mới'){return a.length?`<div class="file-list">${a.map(fileCard).join('')}</div>`:`<div class="empty"><div class="empty-ico">${icon('files',27)}</div><h3>${esc(emptyTitle)}</h3><p>${window.NSMOD_IS_DEMO?'Thử chọn danh mục khác hoặc thay từ khóa tìm kiếm.':'Danh sách sẽ hiện ở đây khi NSMOD thêm MOD, hình ảnh và link tải.'}</p><a href="#/categories">Khám phá danh mục ${icon('arrow',15)}</a></div>`}
function footer(){return `<footer class="footer"><strong>NSMOD GTA V iOS</strong> · Thư viện MOD, video & liên kết<br>© 2026 NSMOD • Thiết kế tối ưu cho điện thoại</footer>`}
function home(){const banner=imageURL(cfg.banner)||'ICON/chua-co-anh.svg',banner4k=imageURL(cfg.banner4k)||banner;return `<div class="page"><section class="hero"><img class="hero-art" src="${esc(banner4k)}" alt="Phong cảnh thành phố Los Santos trong GTA V" fetchpriority="high" onerror="this.onerror=null;this.src='${esc(imageURL('ICON/chua-co-anh.svg'))}'"><div class="hero-gradient"></div><div class="hero-copy"><span class="hero-kicker">GTA V · iOS COMMUNITY</span><h1>LOS SANTOS<br><em>MOD CENTER.</em></h1><p>Kho liên kết MOD, video và tip trick. Chạm danh mục rồi mở link cực nhanh trên iPhone.</p><a class="hero-action" href="#/categories">KHÁM PHÁ NGAY ${icon('arrow',18)}</a></div><div class="hero-ticker"><span>NSMOD</span><span class="ticker-line"></span><span>GTA V / MOD LIBRARY</span></div></section><section class="section section-categories-home">${sectionHead('QUICK ACCESS / NSMOD','Danh mục GTA V','#/categories','Mới nhất đầu tiên, Hướng dẫn cài & Tip Trick ngay bên dưới, sau đó là các mục MOD.')}${categoriesGrid()}</section><section class="section" style="margin-top:20px">${searchBox()}</section><section class="section latest-feature">${sectionHead('NEW DROPS / THEO GIỜ','Card mới cập nhật','#/latest','Tự sắp xếp theo ngày, giờ và phút mới nhất.')}${fileList(sorted().slice(0,3),'Chưa có bản cập nhật')}</section><div class="announcement">${icon('info',19)}<span>${esc(cfg.announcement||'Bấm TẢI XUỐNG sẽ mở liên kết ngoài, không tự tải file.')}</span></div>${footer()}</div>`}

function pageHeader(title,kicker,description){return `<div class="page-top"><a class="back-link" href="#/">${icon('back',15)} Trang chủ</a><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>`}
function categoriesPage(){return `<div class="page">${pageHeader('Danh mục GTA V','MOD LIBRARY','Mới nhất ở đầu, Hướng dẫn ngay bên dưới, tiếp theo là các danh mục MOD. Chọn mục để xem card.')}${categoriesGrid()}${footer()}</div>`}
function guidePage(){return `<div class="page">${pageHeader('Hướng dẫn cài & Tip Trick','VIDEO / TIP TRICK','Chọn card hướng dẫn để xem video tại liên kết bạn cung cấp.')}<a href="#/category/huongdan">Xem các video hướng dẫn</a>${footer()}</div>`}

function filterUI(cat){return `<div class="filter-box">${searchBox(filters.q)}<div class="filter-controls"><select class="filter-select" id="filter-category" ${cat?'disabled':''} aria-label="Chọn danh mục"><option value="">Tất cả danh mục</option>${categories.map(c=>`<option value="${esc(c.id)}" ${filters.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="filter-select" id="filter-sort" aria-label="Sắp xếp file"><option value="new" ${filters.sort==='new'?'selected':''}>Mới nhất trước</option><option value="old" ${filters.sort==='old'?'selected':''}>Cũ nhất trước</option><option value="az" ${filters.sort==='az'?'selected':''}>Tên A – Z</option></select></div></div>`}
function listPage(r){const isFav=r.page==='favorites';const cat=r.page==='category'?catBy(r.id):null;if(r.page==='category'&&!cat)return `<div class="page">${pageHeader('Không có danh mục','NOT FOUND','Danh mục không tồn tại.')}<a href="#/categories">Xem danh mục</a></div>`;const title=isFav?'Yêu thích':cat?cat.name:r.page==='search'?'Tìm kiếm MOD':'Mới nhất';const subtitle=isFav?'Các card bạn đã lưu trên điện thoại này.':cat?(cat.id==='huongdan'?'Danh sách video hướng dẫn và mẹo. Chọn XEM VIDEO để mở liên kết.':cat.subtitle):'Tất cả card được xếp theo ngày, tháng, giờ và phút cập nhật.';const chips=!isFav?`<nav class="chips" aria-label="Lọc nhanh danh mục MOD"><a class="chip ${filters.cat===''?'active':''}" href="#/latest" ${filters.cat===''?'aria-current="page"':''}>Tất cả</a>${categories.map(c=>`<a class="chip ${filters.cat===c.id?'active':''}" href="#/latest?cat=${encodeURIComponent(c.id)}" ${filters.cat===c.id?'aria-current="page"':''}>${esc(c.name)}</a>`).join('')}</nav>`:'';return `<div class="page">${pageHeader(title,isFav?'SAVED / FAVORITES':cat?'CATEGORY / GTA V':'UPDATES / NSMOD',subtitle)}${chips}${filterUI(cat)}<div class="result-top"><strong>FILE HIỂN THỊ</strong><span id="result-count">0 file</span></div><div id="results"></div>${footer()}</div>`}
function updateResults(r){const target=el('results');if(!target)return;let items=[...mods];if(r.page==='favorites')items=items.filter(m=>favs.has(String(m.id)));if(filters.cat)items=items.filter(m=>m.category===filters.cat);if(filters.q){const q=norm(filters.q);items=items.filter(m=>norm([m.title,m.description,m.category,m.format,catBy(m.category)?.name].join(' ')).includes(q))}if(filters.sort==='old')items.sort((a,b)=>-byDate(a,b));else if(filters.sort==='az')items.sort((a,b)=>String(a.title).localeCompare(String(b.title),'vi'));else items.sort(byDate);el('result-count').textContent=items.length+' file';const noTitle=filters.q?'Không tìm thấy card phù hợp':r.page==='favorites'?'Chưa có MOD yêu thích':'Chưa có card trong mục này';target.innerHTML=fileList(items,noTitle);const p=target.querySelector('.empty p');if(p&&r.page==='favorites')p.textContent='Nhấn biểu tượng trái tim trên mỗi file để lưu vào mục này. Dữ liệu được lưu tại điện thoại của bạn.';if(p&&filters.q)p.textContent='Thử từ khóa ngắn hơn hoặc chọn lại danh mục.'}
function render(goTop=true){const r=route();const id=r.page+'/'+r.id+'?'+r.query.toString();if(id!==previousRoute){filters={q:r.query.get('q')||'',cat:r.page==='category'?r.id:(categories.some(c=>c.id===r.query.get('cat'))?r.query.get('cat'):''),sort:'new'};previousRoute=id}header();bottomNav(r);$app.innerHTML=r.page==='home'?home():r.page==='categories'?categoriesPage():r.page==='guide'?guidePage():['latest','favorites','category','search'].includes(r.page)?listPage(r):categoriesPage();updateResults(r);if(goTop)window.scrollTo(0,0)}
function favorite(id){const key=String(id);if(favs.has(key))favs.delete(key);else favs.add(key);try{localStorage.setItem(FAVKEY,JSON.stringify([...favs]))}catch{notify('Không thể lưu trên trình duyệt này')}const y=window.scrollY;render(false);window.scrollTo(0,y);notify(favs.has(key)?'Đã thêm vào Yêu thích':'Đã bỏ khỏi Yêu thích')}
const popup=el('telegram-popup');let popupFocus=null;
function openPopup(){if(!cfg.showTelegramPopup)return;popupFocus=document.activeElement;popup.hidden=false;document.body.style.overflow='hidden';popup.querySelector('.popup-card').focus({preventScroll:true})}
function closePopup(){popup.hidden=true;document.body.style.overflow='';try{sessionStorage.setItem(POPKEY,'1')}catch{}if(popupFocus&&popupFocus.focus)popupFocus.focus()}
const viewer=el('image-viewer');let activeGallery=[],imagePos=0;
function showImage(){const current=activeGallery[imagePos];if(!current)return;el('viewer-img').src=current;el('viewer-count').textContent=`${imagePos+1} / ${activeGallery.length}`;viewer.querySelector('[data-prev-img]').hidden=activeGallery.length<2;viewer.querySelector('[data-next-img]').hidden=activeGallery.length<2}
function openGallery(id){const m=mods.find(x=>String(x.id)===String(id));if(!m)return;activeGallery=[m.cover,...(Array.isArray(m.gallery)?m.gallery:[])].map(imageURL).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);if(!activeGallery.length)return;priorFocus=document.activeElement;imagePos=0;el('viewer-title').textContent=m.title;showImage();viewer.hidden=false;document.body.style.overflow='hidden';viewer.querySelector('[data-close-viewer]').focus()}
function closeGallery(){viewer.hidden=true;document.body.style.overflow='';if(priorFocus&&priorFocus.focus)priorFocus.focus()}
document.addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){favorite(fav.dataset.fav);return}const gallery=e.target.closest('[data-gallery]');if(gallery){openGallery(gallery.dataset.gallery);return}if(e.target.closest('[data-close-popup]')){closePopup();return}if(e.target.closest('[data-close-viewer]')){closeGallery();return}if(e.target.closest('[data-next-img]')){imagePos=(imagePos+1)%activeGallery.length;showImage();return}if(e.target.closest('[data-prev-img]')){imagePos=(imagePos+activeGallery.length-1)%activeGallery.length;showImage()}});
document.addEventListener('submit',e=>{if(!e.target.matches('[data-search-form]'))return;e.preventDefault();const q=e.target.querySelector('[name=q]')?.value.trim()||'';const r=route();if(r.page==='home'||r.page==='categories'||r.page==='guide'){location.hash='#/search?q='+encodeURIComponent(q);return}filters.q=q;updateResults(r)});
document.addEventListener('input',e=>{if(!e.target.matches('#results input, .filter-box [name=q]'))return;filters.q=e.target.value;updateResults(route())});
document.addEventListener('change',e=>{if(e.target.id==='filter-category'){filters.cat=e.target.value;updateResults(route())}if(e.target.id==='filter-sort'){filters.sort=e.target.value;updateResults(route())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!viewer.hidden)closeGallery();else if(!popup.hidden)closePopup()}if(!viewer.hidden&&e.key==='ArrowRight'){imagePos=(imagePos+1)%activeGallery.length;showImage()}if(!viewer.hidden&&e.key==='ArrowLeft'){imagePos=(imagePos+activeGallery.length-1)%activeGallery.length;showImage()}});
window.addEventListener('hashchange',()=>render());
render();el('popup-join').href=telegram;
if(cfg.showTelegramPopup){try{if(sessionStorage.getItem(POPKEY)!=='1')setTimeout(openPopup,650)}catch{setTimeout(openPopup,650)}}
})();
